name: Deploy Virtual Gallery Agents

on:
  push:
    branches: [master, main]
    paths:
      - 'agents/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - 'supabase/migrations/**'
  workflow_dispatch:  # Manual trigger

jobs:
  deploy-agents:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv pytest pytest-asyncio pydantic aiohttp
      
      - name: Setup Supabase CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/supabase/cli/main/install.sh | sh
      
      - name: Run tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          cd agents
          pytest test_orchestration.py -v
      
      - name: Deploy Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
          supabase migration push --dry-run
      
      - name: Verify deployment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          cd agents
          python setup_deployment.py
      
      - name: Report deployment status
        if: always()
        run: |
          echo "## 🚀 Agent Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All agents committed and deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure secrets in GitHub (Settings → Secrets and variables → Actions)" >> $GITHUB_STEP_SUMMARY
          echo "2. Set environment variables in Vercel deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. Run CLI orchestrator: \`python agents/cli_orchestrator.py\`" >> $GITHUB_STEP_SUMMARY
